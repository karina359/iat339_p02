            <h1>Payment</h1>

        </header> 
    <section class="element" id="payment">
            <h2>Payment Form</h2>


            <p>Choose your payment option</p>

            <!-- soruce: https://www.w3schools.com/html/html_forms.asp -->

            <form action="../iat339_p02/feedback.html". method="get">

                <div class="payment-container">

                    <fieldset class="billing_address">
                        <legend>Billing Address</legend>

                        <!-- name -->
                        <label for="name">Name:</label><br>
                            <input type="text" id="name" placeholder="Jane Doe"><br>

                        <!-- email -->
                        <label for="email">Email:</label><br>
                            <input type="text" id="email" placeholder="jane@example.com"><br>

                        <!-- address -->
                        <label for="address">Address:</label><br>
                            <input type="text" id="address" placeholder="123 Street"><br>
                        
                        <!-- city -->
                        <label for="city">City:</label><br>
                            <input type="text" id="city" placeholder="Vancouver"><br>

                    </fieldset>
                    
                    <fieldset class="card_payment">
                        <legend>Payment</legend>

                        <!-- radio button for card options -->

                        <!-- visa -->
                        <input type="radio" id="visa" name="payment_option" value="VISA">
                        <label for="visa">VISA</label><br>

                        <!-- mastercard -->
                        <input type="radio" id="mastercard" name="payment_option" value="MASTERCARD">
                        <label for="mastercard">MASTERCARD</label><br>

                        <!-- paypal -->
                        <input type="radio" id="paypal" name="payment_option" value="PAYPAL">
                        <label for="paypal">PAYPAL</label><br>


                        <!-- text input for card payment -->

                        <!-- name on card -->
                        <label for="card_name">Name on Card:</label><br>
                        <input type="text" id="card_name" placeholder="Jane More Doe"><br>

                        <!-- card number -->
                        <label for="card_payment">Card Number:</label><br>
                        <input type="text" id="card_payment" placeholder="123456789"><br>
                        
                        <!-- expire date -->
                        <label for="card_exp">Card Expiry Date:</label><br>
                        <input type="text" id="card_exp" placeholder="12/34"><br>
            

                    </fieldset>

                </div>

                <!-- submit button -->
               <button type="submit" class="add-to-cart"> Submit</button>

            </form>

        
      </section>
</body>
</html>
